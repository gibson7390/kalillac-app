kind = "mobile"
previewPath = "/"
title = "Kalillac"
description = "Privacy-first iPhone application shell. Milestone 1 uses mock AI, research, purchases, and memory-only saved snapshots; no production services."
version = "1.0.0"
id = "artifacts/kalillac-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23980

[services.development]
run = "pnpm --filter @workspace/kalillac-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kalillac-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kalillac-mobile", "run", "serve" ]

[services.env]
PORT = "23980"
BASE_PATH = "/"
