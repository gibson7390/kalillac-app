kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.env]
KALILLAC_MODEL = "openrouter/free"

[services.production]

[services.production.build]
args = ["python", "-m", "compileall", "artifacts/api-server/fastapi_app.py", "artifacts/api-server/provider.py"]

[services.production.run]
args = ["python", "-m", "uvicorn", "fastapi_app:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
KALILLAC_MODEL = "openrouter/free"

[services.production.health.startup]
path = "/health"
